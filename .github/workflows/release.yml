name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build packages
        run: make release

      - name: Extract release notes
        run: |
          awk '/^## [0-9]/{if(found) exit} /^## [0-9]/{found=1} found' CHANGELOG.md > /tmp/release-notes.md

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: send-matrix-mail ${{ github.ref_name }}
          body_path: /tmp/release-notes.md
          draft: false
          prerelease: false
          files: |
            dist/*.deb
            dist/*.tar.gz